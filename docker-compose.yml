services:
  arogyasetu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arogyasetu-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
